name: Terraform Plan (starter)

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'modules/**'

# TODO (Fase 3): faltan permisos.
#   - pull-requests: write  (para comentar el plan)
#   - id-token: write       (para OIDC)
permissions:
  contents: read

env:
  TF_VERSION: '1.9.8'
  AWS_REGION: us-east-1

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      # TODO (Fase 2): autenticar con OIDC usando el rol de SOLO LECTURA
      #   uses: aws-actions/configure-aws-credentials@v4
      #   role-to-assume: arn:aws:iam::<ACCOUNT_ID>:role/tf-plan-m5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform init -input=false

      # TODO (Fase 3): añade 'terraform fmt -check -recursive' y 'terraform validate'
      #                como pasos que actúen de gate.

      - name: Terraform plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan

      # TODO (Fase 3): publica el plan como COMENTARIO en el PR con
      # actions/github-script@v7, y haz que se ACTUALICE en vez de duplicarse
      # (pista: inserta un marcador HTML en el body y búscalo con listComments).
